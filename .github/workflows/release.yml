name: Build and Release ISO

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build ruddervirt-setup binary
        run: make build-tui VERSION="${GITHUB_REF_NAME}"

      # Computed before the ISO build so create-iso.py can template the real
      # download URL + hash into the same ISO it's building, without any
      # fetch back to GitHub (the release doesn't exist yet at this point).
      - name: Compute ruddervirt-setup checksum
        id: checksum
        run: |
          hash="$(sha256sum scripts/ruddervirt-setup | cut -d' ' -f1)"
          echo "hash=sha256-${hash}" >> "$GITHUB_OUTPUT"
          printf '%s  ruddervirt-setup\n' "$hash" > scripts/ruddervirt-setup.sha256

      - name: Build the installer ISO
        run: |
          make iso VERSION="${GITHUB_REF_NAME}" \
            ARGS="--setup-checksum ${{ steps.checksum.outputs.hash }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/ruddervirt-install-${{ github.ref_name }}-x86_64.iso
          fail_on_unmatched_files: true
          generate_release_notes: true

      # ruddervirt-setup itself is an internal upgrade artifact (fetched by
      # the running TUI's self-update flow, see tui/update.go), not something
      # end users download - so it's pushed to a dedicated orphan branch
      # instead of the public Releases page, which should only ever show the
      # installer ISO. One folder per version, so older tags stay fetchable.
      - name: Publish ruddervirt-setup binary
        env:
          VERSION: ${{ github.ref_name }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          workdir="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$REMOTE" release-binaries >/dev/null 2>&1; then
            git clone --depth 1 --branch release-binaries "$REMOTE" "$workdir"
          else
            git clone --depth 1 --no-checkout "$REMOTE" "$workdir"
            git -C "$workdir" checkout --orphan release-binaries
            git -C "$workdir" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$workdir/$VERSION"
          cp scripts/ruddervirt-setup "$workdir/$VERSION/ruddervirt-setup"
          cp scripts/ruddervirt-setup.sha256 "$workdir/$VERSION/ruddervirt-setup.sha256"

          git -C "$workdir" add "$VERSION"
          git -C "$workdir" commit -m "Add ruddervirt-setup $VERSION"
          git -C "$workdir" push origin HEAD:release-binaries
