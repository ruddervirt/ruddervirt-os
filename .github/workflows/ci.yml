name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Go TUI lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: ruddervirt-setup

      - name: Go TUI unit tests
        run: make test-tui

      # Validate that server.bu still compiles and the injected files render — this is
      # the filesystem `make test-container` overlays. Running a binary inside it is
      # future work that will rewire the Makefile.
      - name: Render check (server.bu -> rootfs)
        run: make test-rootfs
