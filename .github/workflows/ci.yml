name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # Unit tests live here (the Makefile is Go-toolchain free). No-op until a
      # go.mod exists at the repo root, then runs automatically once Go source is added.
      - name: Unit tests
        run: |
          if [ -f go.mod ]; then go test ./...; else echo "no go.mod yet — skipping"; fi

      # Validate that server.bu still compiles and the injected files render — this is
      # the filesystem `make test-container` overlays. Running a binary inside it is
      # future work that will rewire the Makefile.
      - name: Render check (server.bu -> rootfs)
        run: make test-rootfs
